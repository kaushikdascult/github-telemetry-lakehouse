name: Continuous Developer Telemetry Pipeline

on:
  schedule:
    # Run once every hour at minute 0 (24 runs/day = ~16 min/month, well within 2,000 free minutes)
    - cron: '0 * * * *'
  workflow_dispatch: # Enable manual run via GitHub UI button
  push:
    branches:
      - main

concurrency:
  group: telemetry-batch
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Ingestion & dbt Modeling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery dbt-bigquery requests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Ingest GitHub Events to BigQuery Bronze
        env:
          GCP_PROJECT_ID: 'kd-bq-sandbox-2026'
          BQ_BRONZE_DATASET: 'github_bronze'
          BQ_BRONZE_TABLE: 'raw_events'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ingestion/fetch_and_push_bq.py

      - name: Execute dbt Silver & Gold Transformations
        run: |
          cd dbt
          dbt run --profiles-dir .

      - name: Execute dbt Data Quality Assertions
        run: |
          cd dbt
          dbt test --profiles-dir .
