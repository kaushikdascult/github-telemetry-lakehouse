version: 2

models:
  - name: stg_github_events
    description: "Silver staging layer: flattened, typed, and deduplicated GitHub telemetry"
    columns:
      - name: event_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: event_type
        description: "Event classification"
        tests:
          - not_null
      - name: created_at_utc
        description: "Standardized event timestamp in UTC"
        tests:
          - not_null
      - name: actor_login
        description: "Developer username or bot login"
        tests:
          - not_null
